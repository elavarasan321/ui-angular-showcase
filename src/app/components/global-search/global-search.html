@if (open()) {
  <cwr-dialog
    class="global-search-dialog"
    title="Search"
    introText="Find components, inputs and design tokens."
    (dismiss)="close()"
  >
  <div class="dialog-wrapper">
    <div class="global-search-input-wrapper">
      <cwr-search-input
        class="global-search-input"
        [value]="searchTerm()"
        (valueChange)="onSearchTermChange($event)"
        placeholder="Try cwr-button, disabled or --color-bg…"
        aria-label="Search components, inputs and design tokens"
      />
    </div>

    <div class="global-search-results">
      @if (resultGroups().length === 0) {
        <div class="global-search-empty">
          <cwr-icon icon="icon.ui.search" size="lg" />
          <p>Nothing matches "{{ searchTerm() }}"</p>
        </div>
      } @else {
        @for (group of resultGroups(); track trackByGroup($index, group)) {
          <div class="global-search-group">
            <p class="global-search-group-label">{{ group.label }}</p>
            @for (item of group.items; track trackByItem($index, item)) {
              <button
                type="button"
                class="global-search-result"
                [class.is-active]="item.id === activeItemId()"
                (mouseenter)="setActive(item)"
                (click)="selectResult(item)"
              >
                <span class="global-search-result-text">
                  <span class="global-search-result-label">@for (part of highlight(item.label); track $index) {<span [class.global-search-match]="part.match">{{ part.text }}</span>}</span>
                  @if (item.detail) {
                    <span class="global-search-result-detail">@for (part of highlight(item.detail); track $index) {<span [class.global-search-match]="part.match">{{ part.text }}</span>}</span>
                  }
                </span>
                <cwr-icon class="global-search-result-arrow" icon="icon.ui.arrow-right" size="sm" />
              </button>
            }
          </div>
        }
      }
    </div>
    </div>

    <span overlayFooterLeading class="global-search-hints">
      <span class="global-search-hint"><kbd>↑</kbd><kbd>↓</kbd> Navigate</span>
      <span class="global-search-hint"><kbd>↵</kbd> Select</span>
      <span class="global-search-hint"><kbd>esc</kbd> Close</span>
    </span>
  </cwr-dialog>
}
