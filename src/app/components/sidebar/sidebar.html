<nav class="sidebar" aria-label="Component navigation">
  <div class="sidebar-header">
    <a class="sidebar-brand" routerLink="getting-started" aria-label="UI Angular Showcase home">
      <cwr-logo size="sm" />
    </a>

    <div class="sidebar-actions-row">
      <cwr-icon-button
        icon="icon.ui.search"
        variant="outline"
        intent="neutral"
        size="md"
        [tooltipPosition]="'right'"
        label="Search everywhere (⌘K)"
        (buttonClick)="openGlobalSearch()"
      ></cwr-icon-button>
      <cwr-icon-button
        [icon]="isDarkMode ? 'icon.ui.sun' : 'icon.ui.moon'"
        variant="solid"
        intent="neutral"
        size="md"
        label="Toggle theme"
        (buttonClick)="themeToggle.emit()"
      ></cwr-icon-button>
    </div>
  </div>

  <div class="sidebar-scroll">
    <div class="sidebar-top">
      @for (item of topItems; track trackByItem($index, item)) {
        <a
          class="sidebar-link"
          [routerLink]="item.route"
          routerLinkActive="is-active"
          (click)="onItemClick(item)"
        >
          <span class="sidebar-link-label">{{ item.label }}</span>
          @if (item.badge) {
            <cwr-badge
              class="sidebar-link-badge"
              [value]="item.badge.text"
              intent="brand"
              [emphasis]="isActiveRoute(item.route) ? 'inverse' : 'subtle'"
            />
          }
        </a>
      }
    </div>

    <div class="sidebar-groups">
      @for (group of groups; track trackByGroup($index, group)) {
        <div class="sidebar-group">
          <button
            type="button"
            class="sidebar-group-header"
            [class.is-expanded]="isExpanded(group)"
            [class.has-active]="hasActiveItem(group)"
            (click)="toggleGroup(group)"
            [attr.aria-expanded]="isExpanded(group)"
            [attr.aria-controls]="group.id + '-panel'"
          >
            <span class="sidebar-group-label">{{ group.label }}</span>
            <cwr-icon
              class="sidebar-group-chevron"
              [class.is-expanded]="isExpanded(group)"
              icon="icon.ui.direction-down"
              size="sm"
            />
          </button>
          @if (isExpanded(group)) {
            <div class="sidebar-group-panel" [id]="group.id + '-panel'">
              @for (item of group.items; track trackByItem($index, item)) {
                <a
                  class="sidebar-link"
                  [routerLink]="item.route"
                  routerLinkActive="is-active"
                  (click)="onItemClick(item)"
                >
                  <span class="sidebar-link-label">{{ item.label }}</span>
                  @if (item.badge) {
                    <cwr-badge
                      class="sidebar-link-badge"
                      [value]="item.badge.text"
                      intent="brand"
                      [emphasis]="isActiveRoute(item.route) ? 'inverse' : 'subtle'"
                    />
                  }
                </a>
              }
            </div>
          }
        </div>
      }
    </div>
  </div>
</nav>
