<style>
  :host {
    display: block;
    height: 100vh;
  }

  .app-shell {
    height: 100%;
  }

  .app-content {
    height: 100%;
    margin-left: var(--size-navbar-min-width);
    overflow-y: auto;
    box-sizing: border-box;
    padding: var(--space-xl, 1.5rem);
  }

  @media (max-width: 768px) {
    .app-content {
      margin-left: 0;
    }
  }
</style>

<div class="app-shell">
  <app-sidebar
    [topItems]="topItems"
    [groups]="groups"
    [isActiveRoute]="isActiveRoute"
    [isDarkMode]="isDarkMode"
    (themeToggle)="toggleTheme()"
  ></app-sidebar>

  <app-global-search [topItems]="topItems" [groups]="groups"></app-global-search>

  <div class="app-content" #appContent>
    <router-outlet />
  </div>
</div>
