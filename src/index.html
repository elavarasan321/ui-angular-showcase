<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CWR UI</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Apply the theme before first paint so a light-mode reload doesn't flash dark. A saved
      // choice wins; on a first visit, follow the OS preference.
      // Keep the storage key in sync with THEME_STORAGE_KEY in src/app/app.ts.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('cwr-showcase-theme');
        } catch {}
        var light = saved
          ? saved === 'light'
          : window.matchMedia('(prefers-color-scheme: light)').matches;
        if (light) document.documentElement.setAttribute('data-theme', 'light');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&amp;family=Roboto:wght@200;300;400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLmaskl7CVJkEZSMUkrQ6usKu8zSmHQ5rPB6O6ciUQvM9lYbKaSEJD_NIOD3dhPlaRUs9SpJlwkWQO6zijQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
